

model:
  hidden_dim: 128
  num_heads: 8
  num_layers: 3
  patch_len: 12        
  stride: 6            
  seq_len: 60         
  num_features: 9      
  dropout: 0.1
  forecast_horizons: [30, 60, 90]   

training:
  output_dir: "models/oracle"
  num_epochs: 50
  batch_size: 64
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  early_stopping_patience: 5
  val_split: 0.15
  test_split: 0.10

conformal:
  calibration_alpha: 0.1  
  min_calibration_samples: 200

serving_latency_budget_ms: 80.0

mlflow_experiment: "argus/predictive_oracle"

alert_threshold: 0.65   

kafka_telemetry_topic: "argus.telemetry"
kafka_predictions_topic: "argus.risk.predictions"
