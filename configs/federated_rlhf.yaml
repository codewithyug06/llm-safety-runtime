

coordinator:
  host: "0.0.0.0"
  port: 8080
  strategy: "fedavg"      
  min_clients: 2
  min_available_clients: 2
  num_rounds: 50

fedprox:
  proximal_mu: 0.01      

differential_privacy:
  enabled: true
  noise_multiplier: 1.1
  max_grad_norm: 1.0
  target_epsilon: 3.0      
  target_delta: 1.0e-5     
  accountant: "rdp"         

local_training:
  epochs: 2
  batch_size: 8
  learning_rate: 3.0e-5
  optimizer: "adamw"

model:
  registry_name: "argus-safety-critic"
  base_stage: "Production" 

mlflow:
  tracking_uri: "${MLFLOW_TRACKING_URI}"
  experiment_name: "argus/federated_rlhf"

kubeflow:
  pipeline_name: "argus-federated-rlhf-v1"
  namespace: "argus-prod"
  service_account: "argus-kubeflow-sa"

evaluation:
  metrics: ["safety_accuracy", "false_negative_rate", "kl_vs_reference"]
  promotion_threshold:
    safety_accuracy: 0.85
    false_negative_rate: 0.10   
